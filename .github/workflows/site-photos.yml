# Rapatrie les photos de l'ancien site lg-box.fr dans public/photos/ et les
# committe sur la branche. À relancer à la main (Actions → Photos du site →
# Run workflow) si une photo manque.
name: Photos du site

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/site/photos.json"
      - "scripts/fetch-site-photos.mjs"
      - ".github/workflows/site-photos.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-site-photos.mjs
      - name: Committer les photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          git diff --cached --quiet || git commit -m "chore(site): photos reprises de lg-box.fr"
          git push
