<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG BOX — Back-office</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --ink:#f1f2f4; --surface:#ffffff; --surface-hi:#f5f6f8; --hairline:#e1e4e8;
  --text:#1a1d21; --muted:#6b7280; --muted-2:#9aa0a6;
  --signal:#0b8fa3; --signal-dim:#e4f4f6; --signal-hover:#0a7788;
  --green:#1f9d55; --green-dim:#e6f6ed; --green-border:#b8e3c8;
  --red:#dc3b34; --red-dim:#fcebea; --red-border:#f3b9b5;
  --amber:#b8791f; --amber-dim:#fbf1e0; --amber-border:#e9cf9e;
  --blue:#2f6fb0; --blue-dim:#e8f1fa; --blue-border:#bcd9f0;
  --gray-dim:#eef0f2; --gray-border:#d8dbde;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--ink);color:var(--text)}
.app{display:flex;height:100vh}
.sidebar{width:190px;background:var(--surface);border-right:1px solid var(--hairline);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:16px;border-bottom:1px solid var(--hairline)}
.logo-title{font-family:'Space Grotesk';font-size:15px;font-weight:600;color:var(--signal)}
.logo-sub{font-size:10px;color:var(--muted-2);margin-top:2px}
.nav{flex:1;padding:8px 6px;overflow-y:auto}
.nav-section{font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:1px;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);margin-bottom:1px}
.nav-item:hover{background:var(--surface-hi);color:var(--text)}
.nav-item.active{background:var(--signal-dim);color:var(--signal);font-weight:500;border:1px solid transparent}
.occ-bar{padding:12px 14px;border-top:1px solid var(--hairline);font-size:12px;color:var(--muted)}
.bar-track{height:3px;background:var(--hairline);border-radius:99px;margin-top:6px}
.bar-fill{height:100%;border-radius:99px;background:var(--signal)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:48px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;padding:0 20px;background:var(--surface);flex-shrink:0}
.topbar-title{font-family:'Space Grotesk';font-size:17px;font-weight:600;flex:1}
.content{flex:1;overflow-y:auto;padding:20px}
.kpis{display:grid;gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(20,20,20,.03)}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-val{font-family:'Space Grotesk';font-size:23px;font-weight:700;line-height:1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px;margin-bottom:18px}
.box-cell{border-radius:7px;border:1px solid;padding:7px 4px;cursor:pointer;text-align:center}
.box-cell:hover{opacity:.7}
.box-num{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600}
.box-sz{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,20,20,.03)}
.card-head{padding:12px 16px;border-bottom:1px solid var(--hairline);font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{padding:8px 14px;text-align:left;font-size:10px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--hairline);text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--surface-hi)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-hi)}
.bdg{display:inline-flex;padding:2px 7px;border-radius:5px;font-size:11px;font-family:'IBM Plex Mono',monospace}
.bdg-blue{background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue-border)}
.bdg-green{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)}
.bdg-red{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}
.bdg-warn{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border)}
.bdg-gray{background:var(--gray-dim);color:var(--muted);border:1px solid var(--gray-border)}
.btn{padding:5px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;border:1px solid var(--gray-border);background:transparent;color:var(--text)}
.btn:hover{background:var(--surface-hi)}
.btn-primary{background:var(--signal);color:#fff;border-color:var(--signal);font-weight:500}
.btn-primary:hover{background:var(--signal-hover)}
.btn-success{background:transparent;color:var(--green);border-color:var(--green-border)}
.btn-danger{color:var(--red);border-color:var(--red-border)}
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;width:560px;max-width:95vw;padding:24px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 40px -20px rgba(20,20,20,.25)}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface-hi);border:1px solid var(--gray-border);border-radius:7px;padding:8px 11px;color:var(--text);font-family:inherit;font-size:13px;outline:none}
.field input:focus{border-color:var(--signal)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green-dim);border:1px solid var(--green);border-radius:8px;padding:12px 18px;font-size:13px;color:var(--green);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 20px -8px rgba(20,20,20,.15)}
.toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:var(--muted)}
.drop-zone{border:2px dashed var(--gray-border);border-radius:10px;padding:32px;text-align:center;cursor:pointer;transition:border .2s;margin-bottom:16px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--signal);background:var(--signal-dim)}
.drop-zone-icon{font-size:32px;margin-bottom:10px}
.drop-zone-text{font-size:14px;color:var(--muted);margin-bottom:4px}
.drop-zone-sub{font-size:12px;color:var(--muted)}
.reconcile-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--surface-hi);flex-wrap:wrap}
.reconcile-row:last-child{border-bottom:none}
.reconcile-row.matched{background:var(--green-dim)}
.reconcile-row.unmatched{background:var(--amber-dim)}
.reconcile-row.unknown{background:var(--surface-hi)}
.match-indicator{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.info-banner{background:var(--blue-dim);border:1px solid var(--blue-border);border-radius:8px;padding:12px 16px;font-size:12px;color:var(--blue);margin-bottom:14px;line-height:1.6}

/* --- PLAN INTERACTIF --- */
.plan-container {
  position: relative;
  width: 100%;
  height: calc(100vh - 120px);
  background: var(--surface-hi);
  border: 1px dashed var(--gray-border);
  border-radius: 10px;
  overflow: auto;
  background-image: radial-gradient(#dfe2e5 1px, transparent 1px);
  background-size: 20px 20px;
}

.box-draggable {
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 7px;
  border: 1px solid;
  padding: 8px 4px;
  text-align: center;
  cursor: grab;
  user-select: none;
  box-shadow: 0 4px 10px -4px rgba(20,20,20,.15);
  transition: transform 0.1s;
  background: var(--surface);
}

.box-draggable:active {
  cursor: grabbing;
  transform: scale(1.05);
  z-index: 10;
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-title">LG BOX</div>
      <div class="logo-sub">Guengat — Back-office</div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="occ-bar">
      <span>Occupation : <strong id="occ-pct" style="color:#f0ece4">—</strong></span>
      <div class="bar-track"><div class="bar-fill" id="occ-bar" style="width:0%"></div></div>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="page-title">Chargement...</span>
    </div>
    <div class="content" id="content"><div class="loading">Connexion à la base de données...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="csv-input" accept=".csv,.txt" style="display:none">

<script>
const SUPABASE_URL = 'https://hesuunwaputjlvyensfx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhlc3V1bndhcHV0amx2eWVuc2Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTMyMTAsImV4cCI6MjA5NDE4OTIxMH0.RdkTlHamZfHeo08zidahGXkn1d2V90d5vrprGfiwt8k';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CFG={
  occ:{label:"Loué",dot:"#2f6fb0",bg:"#e8f1fa",border:"#bcd9f0"},
  late:{label:"Impayé",dot:"#dc3b34",bg:"#fcebea",border:"#f3b9b5"},
  free:{label:"Libre",dot:"#8b9198780",bg:"#f5f6f8",border:"#d8dbde"},
  rsv:{label:"Réservé",dot:"#b8791f",bg:"#fbf1e0",border:"#e9cf9e"},
  mnt:{label:"Maintenance",dot:"#6b7280",bg:"#f5f6f8",border:"#d8dbde"},
};

let page="dashboard", boxes=[], locataires=[], expandedTenant=null;
let bankLines=[], reconcileResults=[], signatures=[];

function toast(msg){const t=document.getElementById('toast');t.textContent='✓ '+msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function bdg(cls,text){return `<span class="bdg bdg-${cls}">${text}</span>`;}

const NAV=[
  {section:"Gestion",items:[
    {id:"dashboard",label:"Tableau de bord"},
    {id:"boxes",label:"Mes Box"},
    {id:"locataires",label:"Locataires"},
  ]},
  {section:"Finance",items:[
    {id:"paiements",label:"Paiements"},
    {id:"rapprochement",label:"Rapprochement bancaire"},
  ]},
  {section:"Configuration",items:[
    {id:"parametres",label:"Paramètres"},
  ]},
];
const TITLES={dashboard:"Tableau de bord",boxes:"Mes Box",locataires:"Locataires",paiements:"Paiements",rapprochement:"Rapprochement bancaire",parametres:"Paramètres"};

function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(g=>`<div class="nav-section">${g.section}</div>${g.items.map(n=>`<div class="nav-item ${page===n.id?'active':''}" onclick="go('${n.id}')">${n.label}</div>`).join('')}`).join('');
  const occ=boxes.filter(b=>["occ","late"].includes(b.status)).length;
  const pct=boxes.length?Math.round(occ/boxes.length*100):0;
  document.getElementById('occ-pct').textContent=pct+'%';
  document.getElementById('occ-bar').style.width=pct+'%';
  document.getElementById('page-title').textContent=TITLES[page]||page;
}

async function go(p){page=p;expandedTenant=null;renderNav();await renderPage();}

async function loadData(){
  const[b,l,s]=await Promise.all([
    sb.from('boxes').select('*').order('numero'),
    sb.from('locataires').select('*').order('nom'),
    sb.from('signatures_bancaires').select('*'),
  ]);
  boxes=b.data||[];
  locataires=l.data||[];
  signatures=s.data||[]; // table absente tant que la migration SQL n'a pas été exécutée — fallback silencieux
}

async function renderPage(){
  document.getElementById('content').innerHTML='<div class="loading">Chargement...</div>';
  await loadData();
  const pages={dashboard:renderDashboard,boxes:renderBoxes,locataires:renderLocataires,paiements:renderPaiements,rapprochement:renderRapprochement,parametres:renderParametres};
  document.getElementById('content').innerHTML=(pages[page]||renderDashboard)();
  if(page==='rapprochement') initDropZone();
}

// ── DASHBOARD ──────────────────────────────────────────────────
function renderDashboard(){
  const occ=boxes.filter(b=>["occ","late"].includes(b.status)).length;
  const free=boxes.filter(b=>b.status==="free").length;
  const late=boxes.filter(b=>b.status==="late").length;
  const rev=boxes.filter(b=>b.status==="occ").reduce((s,b)=>s+b.loyer,0);
  const grid=boxes.map(b=>{const c=CFG[b.status]||CFG.free;return `<div class="box-cell" style="background:${c.bg};border-color:${c.border}" onclick="openBox(${b.id})" title="${b.numero}"><div style="width:5px;height:5px;border-radius:50%;background:${c.dot};margin:0 auto 3px"></div><div class="box-num">${b.numero}</div><div class="box-sz">${b.surface}m²</div></div>`;}).join('');
  const lateList=locataires.filter(l=>l.statut_paiement==="late").map(l=>`<tr><td style="font-weight:500">${l.nom} ${l.prenom||''}</td><td>${bdg('blue',l.box_numero||'—')}</td><td style="font-family:monospace">€${l.loyer_mensuel||'—'}</td><td><button class="btn btn-danger" onclick="toast('Relance envoyée à ${l.nom}')">Relancer</button></td></tr>`).join('')||'<tr><td colspan="4" style="color:#6b7280;text-align:center;padding:20px">Aucun impayé 🎉</td></tr>';
  return `
    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi"><div class="kpi-label">Occupation</div><div class="kpi-val">${Math.round(occ/(boxes.length||1)*100)}%</div><div class="kpi-sub">${occ}/${boxes.length} box</div></div>
      <div class="kpi"><div class="kpi-label">Revenus/mois</div><div class="kpi-val" style="color:#1f9d55">€${rev.toLocaleString()}</div><div class="kpi-sub">loyers actifs</div></div>
      <div class="kpi"><div class="kpi-label">Box libres</div><div class="kpi-val" style="color:#2f6fb0">${free}</div><div class="kpi-sub">disponibles</div></div>
      <div class="kpi"><div class="kpi-label">Impayés</div><div class="kpi-val" style="color:#dc3b34">${late}</div><div class="kpi-sub">à relancer</div></div>
    </div>
    <div class="legend">${Object.entries(CFG).map(([k,v])=>`<div class="legend-item"><div class="dot" style="background:${v.dot}"></div>${v.label} (${boxes.filter(b=>b.status===k).length})</div>`).join('')}</div>
    <div class="grid">${grid}</div>
    <div class="card"><div class="card-head">⚠ Impayés à relancer</div><table><thead><tr><th>Nom</th><th>Box</th><th>Loyer</th><th></th></tr></thead><tbody>${lateList}</tbody></table></div>`;
}

// ── BOXES (VUE PLAN INTERACTIF) ──────────────────────────────────
function renderBoxes() {
  const planHtml = boxes.map((b, index) => {
    const c = CFG[b.status] || CFG.free;
    
    // Si la DB n'a pas encore de pos_x/pos_y, on les place en file indienne pour commencer
    const posX = b.pos_x !== undefined ? b.pos_x : (index % 10) * 80 + 20;
    const posY = b.pos_y !== undefined ? b.pos_y : Math.floor(index / 10) * 80 + 20;

    return `
      <div 
        id="box-drag-${b.id}"
        class="box-draggable" 
        style="background:${c.bg}; border-color:${c.border}; left:${posX}px; top:${posY}px;"
        onmousedown="initDrag(event, ${b.id})"
        ondblclick="openBox(${b.id})" 
        title="Double-clic pour ouvrir"
      >
        <div style="width:6px;height:6px;border-radius:50%;background:${c.dot};margin:0 auto 4px"></div>
        <div class="box-num" style="font-size:12px">${b.numero}</div>
        <div class="box-sz">${b.surface}m²</div>
      </div>
    `;
  }).join('');

  return `
    <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:12px; color:#8b9198;">💡 Glissez-déposez pour organiser le plan. Double-cliquez sur un box pour les détails.</span>
      <button class="btn" onclick="organiserAuto()">Réorganiser la grille</button>
    </div>
    <div class="plan-container" id="plan-bureau">
      ${planHtml}
    </div>
  `;
}

// ── LOCATAIRES ────────────────────────────────────────────────
function renderLocataires(){
  const rows=locataires.map(l=>{
    const sc=l.statut_paiement==="ok"?"green":l.statut_paiement==="late"?"red":"warn";
    const sl=l.statut_paiement==="ok"?"À jour":l.statut_paiement==="late"?"Impayé":"Réservé";
    const exp=expandedTenant===l.id;
    return `<tr onclick="expandTenant(${l.id})" style="cursor:pointer"><td style="font-weight:500">${l.nom} ${l.prenom||''}</td><td>${bdg('blue',l.box_numero||'—')}</td><td style="font-size:12px;color:#6b7280">${l.email}</td><td style="font-family:monospace">€${l.loyer_mensuel||'—'}</td><td>${bdg(sc,sl)}</td><td>${l.statut_paiement==="late"?`<button class="btn btn-danger" onclick="event.stopPropagation();toast('Relance envoyée à ${l.nom}')">Relancer</button>`:''}</td></tr>
    ${exp?`<tr><td colspan="6" style="padding:0"><div style="background:#f5f6f8;padding:14px 16px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px"><div style="background:#ffffff;border:1px solid #e1e4e8;border-radius:5px;padding:10px 12px"><div style="font-size:10px;color:#6b7280;text-transform:uppercase;margin-bottom:3px">Téléphone</div><div style="font-size:12px">${l.telephone||'—'}</div></div><div style="background:#ffffff;border:1px solid #e1e4e8;border-radius:5px;padding:10px 12px"><div style="font-size:10px;color:#6b7280;text-transform:uppercase;margin-bottom:3px">Depuis</div><div style="font-size:12px">${l.date_entree||'—'}</div></div><div style="background:#ffffff;border:1px solid #e1e4e8;border-radius:5px;padding:10px 12px"><div style="font-size:10px;color:#6b7280;text-transform:uppercase;margin-bottom:3px">Box</div><div style="font-weight:500">${l.box_numero||'—'}</div></div></div><div style="display:flex;gap:8px"><button class="btn" onclick="toast('Contrat PDF généré')">Contrat PDF</button><button class="btn" onclick="toast('Mandat SEPA PDF généré')">Mandat SEPA PDF</button><button class="btn btn-danger" onclick="deleteLocataire(${l.id})">Supprimer</button></div></div></td></tr>`:''}`;
  }).join('')||'<tr><td colspan="6" style="color:#6b7280;text-align:center;padding:20px">Aucun locataire</td></tr>';
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-primary" onclick="openAddLocataire()">+ Nouveau locataire</button></div><div class="card"><div class="card-head">Locataires — cliquer pour détails</div><table><thead><tr><th>Nom</th><th>Box</th><th>Email</th><th>Loyer</th><th>Statut</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ── PAIEMENTS ─────────────────────────────────────────────────
function renderPaiements(){
  const rows=locataires.map(l=>{const s=l.statut_paiement;return `<tr><td style="font-weight:500">${l.nom} ${l.prenom||''}</td><td>${bdg('blue',l.box_numero||'—')}</td><td style="font-family:monospace">€${l.loyer_mensuel||'—'}</td><td>${bdg(s==="ok"?"green":"red",s==="ok"?"✓ À jour":"⚠ Impayé")}</td><td>${s==="late"?`<button class="btn btn-danger" onclick="marquerImpaye(${l.id},'ok')">Marquer payé</button>`:`<button class="btn btn-danger" onclick="marquerImpaye(${l.id},'late')">Marquer impayé</button>`}</td></tr>`;}).join('')||'<tr><td colspan="5" style="color:#6b7280;text-align:center;padding:20px">Aucun locataire</td></tr>';
  const totalRev=locataires.filter(l=>l.statut_paiement==="ok").reduce((s,l)=>s+(l.loyer_mensuel||0),0);
  const totalImp=locataires.filter(l=>l.statut_paiement==="late").reduce((s,l)=>s+(l.loyer_mensuel||0),0);
  return `
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="kpi-label">Encaissé</div><div class="kpi-val" style="color:#1f9d55">€${totalRev.toLocaleString()}</div><div class="kpi-sub">${locataires.filter(l=>l.statut_paiement==="ok").length} locataires</div></div>
      <div class="kpi"><div class="kpi-label">Impayés</div><div class="kpi-val" style="color:#dc3b34">€${totalImp.toLocaleString()}</div><div class="kpi-sub">${locataires.filter(l=>l.statut_paiement==="late").length} locataires</div></div>
      <div class="kpi"><div class="kpi-label">Total locataires</div><div class="kpi-val">${locataires.length}</div><div class="kpi-sub">actifs</div></div>
    </div>

// ── LOGIQUE RAPPROCHEMENT ─────────────────────────────────────
function initDropZone(){
  const dz=document.getElementById('drop-zone');
  if(!dz)return;
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)readCSV(f);});
  document.getElementById('csv-input').onchange=e=>{if(e.target.files[0])readCSV(e.target.files[0]);};
}

function readCSV(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    parseAndReconcile(text);
  };
  reader.readAsText(file,'UTF-8');
}

// Signature = version normalisée du libellé (chiffres, dates, mots de liaison retirés).
// Sert d'empreinte stable pour reconnaître un émetteur même quand le libellé est peu informatif,
// et surtout pour ne plus dépendre du seul montant (souvent identique entre locataires).
function signatureOf(libelle){
  return (libelle||'')
    .toUpperCase()
    .replace(/[0-9]/g,'')
    .replace(/\b(VIR|VIREMENT|VIRT|PRLV|PRELEVEMENT|SEPA|DE|POUR|REF|REFERENCE|LE|DU|FACTURE|LOYER|BOX|STOCKAGE)\b/g,'')
    .replace(/[^A-Z ]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function parseAndReconcile(text){
  const lines=text.split('\n').filter(l=>l.trim());
  const results=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const sep=line.includes(';')?';':line.includes('\t')?'\t':',';
    const cols=line.split(sep).map(c=>c.trim().replace(/"/g,''));
    if(cols.length<2)continue;
    let date='',libelle='',montant=0;
    if(cols.length>=3){
      date=cols[0];
      libelle=cols[1];
      const raw=cols[2].replace(/\s/g,'').replace(',','.');
      montant=parseFloat(raw)||0;
      if(cols.length>=4&&montant===0){
        const debit=parseFloat(cols[2].replace(/\s/g,'').replace(',','.'))||0;
        const credit=parseFloat(cols[3].replace(/\s/g,'').replace(',','.'))||0;
        montant=credit-debit;
      }
    }
    if(isNaN(montant)||libelle.toLowerCase().includes('libel')||libelle.toLowerCase().includes('label'))continue;

    const sig=signatureOf(libelle);

    // 1) Signature déjà connue (apprise lors d'un rapprochement précédent) → priorité absolue,
    //    fiable même si le libellé ne contient pas le nom et même en cas de montants identiques entre locataires.
    let locFound=null;
    if(sig.length>=4){
      const known=signatures.find(s=>s.signature===sig);
      if(known) locFound=locataires.find(l=>l.id===known.locataire_id)||null;
    }
    // 2) Repli — nom ou prénom retrouvé littéralement dans le libellé
    if(!locFound){
      const libUpper=libelle.toUpperCase();
      locFound=locataires.find(l=>{
        const nom=(l.nom||'').toUpperCase();
        const prenom=(l.prenom||'').toUpperCase();
        return libUpper.includes(nom)||(prenom&&libUpper.includes(prenom));
      })||null;
    }
    results.push({date,libelle,montant,locataire:locFound,sig});
  }
  if(results.length===0){toast('Fichier non reconnu — vérifiez le format CSV');return;}
  reconcileResults=results;
  renderPage();
}

function loadDemoCSV(){
  let demo='Date;Libellé;Montant\n';
  const mois=['01','02','03','04','05'];
  locataires.slice(0,5).forEach((l,i)=>{
    demo+=`0${i+1}/05/2026;VIR ${(l.nom||'').toUpperCase()} ${(l.prenom||'').toUpperCase()};${l.loyer_mensuel||100}\n`;
  });
  demo+=`06/05/2026;VIR VIREMENT DIVERS REF 84521;215\n`;
  demo+=`07/05/2026;PRLV EDF ELECTRICITE;-180\n`;
  demo+=`08/05/2026;PRLV ASSURANCE LOCAUX;-320\n`;
  parseAndReconcile(demo);
}

async function rememberSignature(sig,locataireId){
  if(!sig||sig.length<4)return;
  await sb.from('signatures_bancaires').upsert({signature:sig,locataire_id:locataireId},{onConflict:'signature'});
}

async function assignManuel(index,locataireId){
  if(!locataireId)return;
  const loc=locataires.find(l=>l.id===parseInt(locataireId));
  if(!loc)return;
  reconcileResults[index].locataire=loc;
  await rememberSignature(reconcileResults[index].sig,loc.id);
  renderPage();
}

async function appliquerRapprochement(){
  const matched=reconcileResults.filter(r=>r.locataire&&r.montant>0);
  if(matched.length===0){toast('Aucun paiement à appliquer');return;}
  for(const r of matched){
    await sb.from('locataires').update({statut_paiement:'ok'}).eq('id',r.locataire.id);
    await rememberSignature(r.sig,r.locataire.id);
  }
  toast(`${matched.length} paiements appliqués ✓`);
  reconcileResults=[];
  await renderPage();
}

s="btn" onclick="document.getElementById('modal-code').style.filter='none'">Voir code</button>${box.status==="free"?`<button class="btn btn-primary" onclick="this.closest('.overlay').remove();openAddLocataire()">Attribuer</button>`:''}${tenant&&tenant.statut_paiement==="late"?`<button class="btn btn-danger" onclick="toast('Relance envoyée');this.closest('.overlay').remove()">Relancer</button>`:''}</div></div>`;
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

// ── LOGIQUE DRAG & DROP ───────────────────────────────────────
let draggedBoxId = null;
let startX, startY, initialBoxX, initialBoxY;

window.initDrag = function(e, id) {
  if (e.button !== 0) return; 
  
  draggedBoxId = id;
  startX = e.clientX;
  startY = e.clientY;
  
  const el = document.getElementById('box-drag-' + id);
  initialBoxX = parseInt(el.style.left, 10) || 0;
  initialBoxY = parseInt(el.style.top, 10) || 0;

  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', stopDrag);
};

function onDrag(e) {
  if (!draggedBoxId) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  
  const el = document.getElementById('box-drag-' + draggedBoxId);
  
  const newX = Math.round((initialBoxX + dx) / 10) * 10;
  const newY = Math.round((initialBoxY + dy) / 10) * 10;
  
  el.style.left = Math.max(0, newX) + 'px';
  el.style.top = Math.max(0, newY) + 'px';
}

async function stopDrag() {
  if (!draggedBoxId) return;
  
  const el = document.getElementById('box-drag-' + draggedBoxId);
  const finalX = parseInt(el.style.left, 10);
  const finalY = parseInt(el.style.top, 10);

  const box = boxes.find(b => b.id === draggedBoxId);
  if(box) {
    box.pos_x = finalX;
    box.pos_y = finalY;
  }

  await sb.from('boxes').update({ pos_x: finalX, pos_y: finalY }).eq('id', draggedBoxId);

  toast('Position enregistrée ✓');

  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', stopDrag);
  draggedBoxId = null;
}

window.organiserAuto = async function() {
  if(!confirm('Réorganiser tous les box automatiquement ?')) return;
  
  boxes.forEach((b, index) => {
    b.pos_x = (index % 10) * 80 + 20;
    b.pos_y = Math.floor(index / 10) * 80 + 20;
  });

  await Promise.all(boxes.map(b => sb.from('boxes').update({ pos_x: b.pos_x, pos_y: b.pos_y }).eq('id', b.id)));

  renderPage();
  toast('Box réorganisés ✓');
};
